
name: ERP hardened core tests

on:
  push:
    paths:
      - 'erp_hardening/**'
      - '.github/workflows/erp-hardened-tests.yml'
  pull_request:
    paths:
      - 'erp_hardening/**'
      - '.github/workflows/erp-hardened-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'pytest>=8,<10'

      - name: Run Python tests
        run: PYTHONPATH=erp_hardening python -m pytest -q erp_hardening/tests

