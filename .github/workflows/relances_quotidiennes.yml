name: Relances Automatiques Impayés

on:
  schedule:
    # S'exécute à 08:00 UTC tous les lundis (1) et jeudis (4)
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'interface GitHub

jobs:
  envoyer-relances:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v3

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas supabase

    - name: Exécuter le script de relance
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      run: python scripts/envoyer_relances.py