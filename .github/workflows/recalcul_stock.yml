name: Audit Nocturne des Stocks

on:
  schedule:
    # S'exécute à 02h00 UTC tous les jours
    - cron: '0 2 * * *'
  workflow_dispatch: # Permet le lancement manuel

jobs:
  auditer-stocks:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v3

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' # CORRIGÉ : Alignement avec runtime.txt

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas supabase

    - name: Exécuter le script d'audit des stocks
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python scripts/recalculer_stock.py