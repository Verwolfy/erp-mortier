name: ERP - observation publique Streamlit (sans session)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streamlit-shell-observe.yml"
      - "app.py"
      - "modules/production/cost_views.py"
      - "modules/production/cost_service.py"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Observe anonymous Streamlit HTML shell only
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error
          from urllib.parse import urlsplit

          url = 'https://nextgent-erp.streamlit.app/'
          result = 'Indéterminé'
          reason = 'Vérification réseau non concluante'
          deployed_sha = 'NON VERIFIABLE SANS SESSION AUTHENTIFIEE'
          try:
              req = urllib.request.Request(url, headers={'User-Agent':'NextGen-ERP-health-observer/1.0'})
              with urllib.request.urlopen(req, timeout=18) as response:
                  host = urlsplit(response.geturl()).hostname
                  status = response.status
                  body = response.read(160000).decode('utf-8', 'replace').lower()
                  if host == 'nextgent-erp.streamlit.app' and status == 200 and ('streamlit' in body):
                      result = 'Coquille HTML Streamlit accessible'
                      reason = 'HTTP 200 ; le contenu contient un marqueur Streamlit'
                  else:
                      result = 'Non confirmé'
                      reason = f'HTTP {status} ; hôte final conforme : {host == "nextgent-erp.streamlit.app"}'
          except urllib.error.HTTPError as exc:
              result = 'Non confirmé'
              reason = f'HTTP {exc.code} (sans authentification)'
          except Exception as exc:
              result = 'Non confirmé'
              reason = f'Échec réseau : {type(exc).__name__}'

          # Aucun identifiant, secret, cookie, corps HTML ni donnée métier journalisés.
          print(f'Observation : {result}. {reason}')
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('# Vérification publique Streamlit\n\n')
                  f.write(f'- URL : {url}\n- Résultat : {result}\n- Détail : {reason}\n')
                  f.write(f'- SHA GitHub testé : {os.environ.get("GITHUB_SHA", "inconnu")} (pas une preuve de déploiement)\n')
                  f.write(f'- Version ERP authentifiée : {deployed_sha}\n')
                  f.write('- **Limite** : ne démontre ni le commit déployé, ni la connexion, ni le bon fonctionnement des modules authentifiés.\n')
          if result != 'Coquille HTML Streamlit accessible':
              print('::warning::Accès HTTP Streamlit non confirmé ; vérifier dans Streamlit Cloud.')
          PY
