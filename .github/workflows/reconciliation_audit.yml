name: ERP - audit de reconciliation sans modification

on:
  push:
    branches: [main, audit/reconciliation-reglementaire-20261028, ops/sauvegardes-erp-preflight-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Dépendances de tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest 'pglast>=7,<8'
      - name: Audit des taux fiscaux figés — rapport non bloquant
        run: python scripts/auditer_parametres_reglementaires.py
      - name: Tests du scanner (doivent détecter les exemples erronés)
        run: python -m pytest -q tests/test_auditer_parametres_reglementaires.py
      - name: Analyser syntaxe PowerShell (sans aucune sauvegarde)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/sauvegarder_supabase_pg.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors; exit 1 }
      - name: Compilation
        run: python -m compileall -q core modules tests scripts
      - name: Suite complète ERP
        run: python -m pytest -q
