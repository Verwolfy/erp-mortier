name: "Nettoyage ponctuel : conserver main uniquement"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_cleanup_branches_once.yml"
permissions:
  contents: write
jobs:
  nettoyage:
    if: github.repository == 'Verwolfy/erp-mortier'
    runs-on: ubuntu-latest
    steps:
      - name: "Verifier les 31 branches de l'inventaire et supprimer sans toucher a main"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "Verwolfy/erp-mortier"
          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          test "$default_branch" = "main"
          open_pr_count="$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_pr_count" = "0"
          cat > /tmp/erp_branches_to_delete <<'BRANCHES'
          feat/finance-quittances-lecture-20261028 4c71ea3037e9f10ad1b1b1a573ce1403c739f2b4
          feat/finance-scf-correspondances-20261029 666247a1f71dcf04be063a05e9fb40c0fbc4e157
          feat/irg-simulations-20261028 ad1e82895feffdddefeb9700e3a2aeb2a290d1cd
          feat/paie-assiettes-qualifiees-20261029 e0c74f4810e9ce86dd079a9276b7eefb9780c8d4
          feat/preflight-finance-interface-20261029 c09b42f25652b65b4ffb21d814a8fcb14b0c73cf
          feat/preflight-irg-cnas-20261029 e3954ec512856501edd77abdfcf0b767c36356ee
          feat/quittances-internes-transaction-20261029 b76c773e8e6752c49e9da5af39ad4f90d272ee98
          feat/referentiels-officiels-algerie-2026-20261029 0e587f0a6cdded3fed1dac1913b3fc2ca8e0b607
          feat/refs-cnas-2026-non-activables-20261029 e7febe8aa73204f34e3455b57f0a4ae7b289a692
          feat/reglementation-lot-c-socle-20261028 03eeacdfcf34992cb468b2418bec78f114b843c5
          feat/scf-lecture-et-verrous-20261028 8d451c7afc3b217b1e7494d5ac90037dffa3c1b6
          feat/timbre-quittance-paliers-20261028 7805dadc6b2fca96224bda1cbbe9fc80a68c59d4
          fix/erp-finance-accuses-schema-20261029 e25efd05422aa5948227efba9f03b72d3cae43de
          fix/irg-lecture-stricte-20261029 7538e18633d727db77843270ddde57bb5880e868
          fix/paie-cnas-unites-assiettes-20261029 deaed1076292f6f1ed55cb53d808d3aedf4b5b68
          fix/rh-paie-droits-frais-20261029 ebf344f735292904f1fa47afb9eb63d4deb8696f
          fix/rh-revalidation-ecriture-20261029 c985f58d301a1941703deb506c924b5f1e298e6f
          fix/scf-paie-verrous-acces-20261028 a2eaac3da02ba30a893973f5207db0bdbb240e10
          fix/timbre-fiscal-ancien-simulateur-20261029 82e911a8412382245f85336f511aad6a9caaa26e
          ops/sauvegardes-erp-preflight-20261028 2cfb9a651d4823148494da13c0fe43e0da56c0c7
          preparation-sync-bdd-20261027 be7557be6d408778b44240eaff6c008b3c9961d4
          release/erp-index-scf-paie-20261028 890d96704bb53300c09d62e0507d3a9202560502
          release/erp-registres-scf-paie-20261028 d7c7fb9495ca07ce0ca798f0fc7b9c1c579bdf14
          BRANCHES
          actual="$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[] | select(.name != "main") | .name' | LC_ALL=C sort)"
          expected="$(cut -d' ' -f1 /tmp/erp_branches_to_delete | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "INVENTAIRE MODIFIE : aucune suppression. Revalider les branches." >&2
            exit 1
          fi
          while IFS=' ' read -r branch sha; do
            [[ -n "$branch" && "$branch" != "main" ]]
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$current" != "$sha" ]]; then
              echo "BRANCHE MODIFIEE : $branch, arret pour ne pas perdre de travail" >&2
              exit 1
            fi
            echo "Suppression : $branch"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done < /tmp/erp_branches_to_delete
          remaining="$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')"
          [[ "$remaining" = "main" ]]
          echo "SUCCES : main est la seule branche"
