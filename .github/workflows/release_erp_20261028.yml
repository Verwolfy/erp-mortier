name: ERP - livraison controlee

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-erp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest 'pglast>=7,<8'
      - name: Controle syntaxe PostgreSQL 17
        run: python -m pytest -q tests/test_sql_parse_migrations_012_015.py
      - name: Compilation
        run: python -m compileall -q core modules tests
      - name: Tests ERP complets
        run: python -m pytest -q
