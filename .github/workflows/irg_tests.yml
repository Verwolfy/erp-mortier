name: ERP - simulateur IRG

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irg-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compilation
        run: python -m compileall -q core modules tests
      - name: Tests IRG et RH
        run: >-
          python -m pytest -q
          tests/test_irg_salaires.py
          tests/test_irg_service.py
          tests/test_irg_rh_view.py
      - name: Tests ERP complets
        run: python -m pytest -q
