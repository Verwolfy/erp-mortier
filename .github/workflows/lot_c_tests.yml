name: ERP - tests lot C facturation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lot-c-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le code sans enregistrer de credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dependances et pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compilation Python
        run: python -m compileall -q core modules tests
      - name: Verrou de préactivation du SQL 013 (refus attendu)
        run: |
          set +e
          python scripts/preactivation_facturation.py sql/013_facturation_parametree.sql
          result=$?
          set -e
          test "$result" -eq 2
      - name: Tests du socle fiscal
        run: >-
          python -m pytest -q
          tests/test_reglementation.py
          tests/test_baremes.py
          tests/test_reglementation_sql_012.py
          tests/test_fiscalite_facturation.py
          tests/test_fiscalite_facturation_dates_2026.py
          tests/test_classification_fiscale.py
          tests/test_precontrole_panier_fiscal.py
          tests/test_liaison_tva_sku.py
          tests/test_exoneration_tva_client.py
          tests/test_lecture_exonerations_tva_clients.py
          tests/test_exoneration_sql_025.py
          tests/test_audit_couverture_tva_sku.py
          tests/test_registre_qualification_sku.py
          tests/test_simulation_facture_tva_lignes.py
          tests/test_diagnostic_arrondi_tva.py
          tests/test_fiscalite_service.py
          tests/test_facturation_sql_013.py
          tests/test_facturation_ecart_historique.py
          tests/test_facturation_gate_activation_013.py
          tests/test_ventes_atomic.py
      - name: Tous les tests ERP (sans secrets et sans acces production)
        run: python -m pytest -q
